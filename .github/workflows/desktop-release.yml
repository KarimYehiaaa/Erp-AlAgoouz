name: Desktop POS Release

on:
  push:
    branches:
      - 'codex/desktop-delivery-*'
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build Windows installer candidate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: './package-lock.json'

      - name: Install workspace dependencies
        run: npm ci

      - name: Setup wizard and Windows launchers
        run: npm run test:setup

      - name: Verify portable encrypted system archives (isolated fixtures)
        run: npm run test:backup

      - name: Install Desktop POS dependencies
        working-directory: desktop-pos
        run: npm ci

      - name: Desktop POS tests
        working-directory: desktop-pos
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test

      - name: Verify release version matches package
        working-directory: desktop-pos
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $tagVersion = if ("${{ github.ref_type }}" -eq 'tag') {
            "${{ github.ref_name }}" -replace '^desktop-v', ''
          } else { '' }
          if ($tagVersion -and $tagVersion -ne $packageVersion) {
            Write-Error "Release tag desktop-v$packageVersion is required; received ${{ github.ref_name }}"
            exit 1
          }

      - name: Build Desktop POS with the guarded installer pipeline
        working-directory: desktop-pos
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
        run: |
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            npm run electron:build
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt 2) { Start-Sleep -Seconds 20 }
          }
          exit 1

      - name: Verify isolated Electron startup and renderer security
        shell: pwsh
        run: node desktop-pos/tests/electron-smoke.mjs

      - name: Verify configured Windows signing before uploading the candidate
        working-directory: desktop-pos
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            Write-Output 'No signing identity configured: this is an unsigned test candidate, not a signed release.'
            exit 0
          }
          $installers = @(Get-ChildItem -LiteralPath release -Filter '*.exe' -File)
          if ($installers.Count -eq 0) {
            throw 'Expected installer is missing.'
          }
          foreach ($file in $installers.FullName) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid') {
              throw "Windows signature verification failed for $(Split-Path -Leaf $file): $($signature.Status)"
            }
          }

      - name: Upload installer candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pos-${{ github.sha }}
          path: |
            desktop-pos/release/*.exe
            desktop-pos/release/*.exe.blockmap
            desktop-pos/release/latest.yml
          if-no-files-found: error
          retention-days: 14
