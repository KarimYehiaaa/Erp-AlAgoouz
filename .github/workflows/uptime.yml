name: Production Uptime Check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  health:
    name: Check production API and web app
    runs-on: ubuntu-latest
    steps:
      - name: Check API health
        run: curl --fail --silent --show-error --max-time 20 https://agoouz.vercel.app/health

      - name: Check web app
        run: |
          curl --fail --silent --show-error --max-time 20 https://agoouz.vercel.app/ | grep -qi '<!doctype html>'
