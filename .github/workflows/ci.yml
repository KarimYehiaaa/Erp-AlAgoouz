name: CI/CD Pipeline

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # اختبارات الباك تعمل ضد قاعدة محلية معزولة (وليس Supabase من .env)
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: bin_al_ajouz_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DB_SSL: 'false'
      DATABASE_URL: ''
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # مطلوب لمقارنة التغييرات مع قاعدة الـ PR (لكشف تغييرات backend فقط)

      # cache: 'npm' يخزّن اعتماديات npm (بمفتاح حسب package-lock.json) فيكون
      # npm ci سريعًا على كل push. كل الخطوات لاحقًا (اختبارات + دخان) تشترك في
      # نفس node_modules المُثبَّت — لا إعادة تثبيت لخطوة الدخان.
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Production monitor regression tests (no external requests)
        run: node --test scripts/deployment/check-production-health.test.mjs

      - name: Source assets contain no stale build bundles
        run: node --test scripts/maintenance/source-assets.test.mjs

      - name: Test database safety before any database setup
        run: node --test backend/scripts/testDatabaseSafety.test.ts

      # الفحص الأمني الصارم للاعتماديات التشغيلية (npm audit --omit=dev)
      # يمنع أي ثغرات High/Critical في بيئة الإنتاج بدون أي continue-on-error.
      - name: Security Audit — Production Runtime (Central ERP)
        run: node scripts/security/security-audit.ts

      - name: Security Audit — Production Runtime (Desktop POS)
        working-directory: desktop-pos
        run: |
          npm ci
          npm audit --omit=dev

      # بوابة نصوص مشوّهة (mojibake): يمنع اندفاع سلاسل '?????' الناتجة عن
      # أخطاء ترميز إلى رسائل المستخدم. أي 4 علامات استفهام متتالية داخل
      # كود المصدر تفشل البناء فوراً.
      - name: Gate — detect mojibake strings in source
        run: |
          if grep -rnE "[?]{4,}" --include="*.ts" --include="*.vue" backend/src frontend/src shared/ 2>/dev/null; then
            echo "❌ وُجدت نصوص مشوّهة (?????) في الكود أعلاه — أصلح الترميز قبل الدمج"
            exit 1
          fi
          echo "✅ لا نصوص مشوّهة"

      # كشف هل غيّر الـ PR ملفات backend (أو مشتركة/اعتماديات) — حتى لا نُشغّل
      # تحقق الباك على PRs تغيّر الواجهة فقط (توفير وقت).
      - name: Detect backend changes (PR)
        id: backend-changed
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "${BASE}...${{ github.sha }}" 2>/dev/null | grep -qE '^(backend|shared)/|^package(-lock)?\.json$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # تحقق الباك الموحّد — أمر واحد يشمل ما كانت تفعله 3 خطوات سابقًا:
      # ① tsc ② إعداد قاعدة الاختبارات المحلية المعزولة (setup+migrate)
      # ③ كل اختبارات vitest (بما فيها الدخان: POST JSON + اختيار dist).
      # يعمل على كل push، وفي الـ PR فقط عند تغيّر backend.
      - name: Backend check:local (tsc + isolated tests)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && steps.backend-changed.outputs.changed == 'true')
        run: npm run check:local

      # دخان سكربتات الصيانة (TS): نفس الأمر الموحّد check:scripts المستخدم محليًا في
      # check:local — يضمن أن Node 24 يقرأ كل ملفات backend/scripts/*.ts (node --check)
      # وأن migrate.ts يتصل بالقاعدة المعزولة وينفّذ فعليًا. أي انتكاس في تحويل
      # السكربتات إلى TS يكسر هذه الخطوة (ومحليًا يكسر check:local أيضًا).
      - name: Smoke — maintenance scripts check (check:scripts)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && steps.backend-changed.outputs.changed == 'true')
        run: npm run check:scripts -w backend

      - name: Frontend Type Check
        run: npm run typecheck -w frontend

      # The recovery drill replaces all application data, so it uses a separate database.
      - name: Backup restore roundtrip (disposable database)
        env:
          DB_NAME: bin_al_ajouz_restore_test
        run: npm run test:local -w backend -- tests/backup-roundtrip.test.ts

      - name: Frontend Tests
        run: npm run test:unit -w frontend

      - name: Desktop POS Tests
        working-directory: desktop-pos
        run: |
          npm ci
          npm test

      # بناء الواجهة بالأمر الموحّد (نفس ما يستخدمه المطور محليًا) + دخان يثبت
      # أن الناتج يذهب إلى frontend/dist (الذي يقدّمه الخادم) وليس dist/ جذر زائد.
      # أي انتكاس في --outDir أو في مسار resolveFrontendDist يكسر هذه الخطوة.
      - name: Frontend Build — must write to frontend/dist (not root dist/)
        run: |
          set -e
          # تبقى فارغة في checkout نظيف؛ ننظفها حتى يكون الفحص حاسمًا لو وُجدت أثر قديم
          rm -rf dist
          npm run build

          # 1) الوجهة الصحيحة: frontend/dist/index.html يجب أن يُبنى فعليًا
          test -f frontend/dist/index.html || {
            echo "❌ frontend/dist/index.html غير موجود — البناء لم يكتب إلى الوجهة الصحيحة"
            exit 1
          }

          # 2) لا وجهة زائدة: dist/ الجذر يجب ألا يحوي index.html (كان يخدع الفحص سابقًا)
          if [ -f dist/index.html ]; then
            echo "❌ أمر البناء كتب إلى dist الجذر بدل frontend/dist — راجع --outDir في package.json"
            exit 1
          fi

          echo "✅ Build OK: npm run build → frontend/dist فقط (لا dist جذر زائد)"

      # دخان تشغيلي ضد الخادم الحقيقي: يضمن أن body-parser يستقبل POST فعليًا
      # وأن الواجهة تُقدَّم من frontend/dist (وليس مجلد dist مزيفًا بلا index.html)
      - name: Smoke — boot server, real POST + GET /
        working-directory: backend
        run: |
          set -e
          PORT=3100 HTTPS_PORT=3443 node src/index.ts > /tmp/smoke-server.log 2>&1 &
          SERVER_PID=$!

          # انتظار جاهزية الخادم عبر /health (يتحقق من اتصال قاعدة البيانات)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3100/health > /dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! curl -sf http://localhost:3100/health > /dev/null 2>&1; then
            echo "❌ الخادم لم يجهز خلال 30 ثانية:"
            tail -20 /tmp/smoke-server.log
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi

          # 1) body-parser: POST JSON عبر الخادم الحقيقي يجب أن يعيد استجابة أعمال
          #    (وليس 500 بسبب "Cannot find module '../encodings'")
          BODY=$(curl -s -X POST http://localhost:3100/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"wrong"}' || true)
          echo "$BODY" | grep -q '"success":' || {
            echo "❌ POST smoke فشل (body-parser/iconv-lite):"
            echo "$BODY" | head -c 400
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          }

          # 2) الواجهة تُقدَّم من frontend/dist الحقيقي (index.html فعلي)
          curl -sf http://localhost:3100/ | grep -q '<!DOCTYPE html>' || {
            echo "❌ GET / فشل (الواجهة لم تُقدَّم — dist مزيف بلا index.html؟)"
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          }

          echo "✅ Smoke OK: POST JSON يعمل + الواجهة تُقدَّم من frontend/dist"
          kill "$SERVER_PID" 2>/dev/null || true

  desktop-build:
    name: Desktop POS Windows Build & Artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Install Desktop POS dependencies
        working-directory: desktop-pos
        run: npm ci
      - name: Desktop POS Security Audit
        working-directory: desktop-pos
        run: npm audit --omit=dev
      - name: Desktop POS Tests
        working-directory: desktop-pos
        run: npm test
      - name: Build Desktop POS Web Bundle
        working-directory: desktop-pos
        run: npm run build
      - name: Build Windows NSIS Installer (.EXE)
        working-directory: desktop-pos
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            # The npm script already sets --publish never. Repeating it produces
            # an array in electron-builder's parser and accidentally enables publishing.
            npm run electron:build
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 2) { Start-Sleep -Seconds 20 }
          }
          exit 1

      - name: Verify NSIS Installer Generated
        shell: pwsh
        working-directory: desktop-pos
        run: |
          $installer = Get-ChildItem "release/AlAgoouz-POS-Setup-*.exe"
          if (-not $installer) {
            Write-Error "❌ NSIS installer not found in desktop-pos/release!"
            exit 1
          }
          if ($installer.Length -lt 20000000) {
            Write-Error "❌ NSIS installer size ($($installer.Length) bytes) is suspiciously small!"
            exit 1
          }
          Write-Host "✅ Verified NSIS Installer: $($installer.Name)"

      - name: Upload Desktop Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlAgoouz-POS-Setup-Windows
          path: desktop-pos/release/AlAgoouz-POS-Setup-*.exe
          if-no-files-found: error
