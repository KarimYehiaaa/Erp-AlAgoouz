<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بن العجوز - نظام ERP</title>
  <meta name="description" content="نظام بن العجوز المتكامل لإدارة المقاهي ومحامص البن — مبيعات، مخزون، تكاليف، وموارد بشرية." />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <meta property="og:title" content="بن العجوز - نظام ERP" />
  <meta property="og:description" content="نظام متكامل لإدارة المقاهي ومحامص البن: مبيعات، مخزون، تكاليف، وموارد بشرية." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#fdf8f3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>
    /* تطبيق الوضع الداكن قبل أول رسم لمنع الوميض الأبيض (FOUC) */
    (function () {
      try {
        var dark = localStorage.getItem('darkMode') === 'true';
        if (dark) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.style.colorScheme = 'light';
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#16100c' : '#fdf8f3');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
