services:
  - type: web
    name: bin-al-ajouz-erp
    env: node
    region: frankfurt
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w frontend
    startCommand: npx tsx backend/src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
