name: Validate legacy database bootstrap and full backend regression

on:
  push:
    branches: ['main', 'codex/legacy-validation-*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: ''
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DB_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm ci
      - name: Backend application and test types
        run: npm run typecheck -w backend
      - name: Full isolated backend regression including real legacy schema fixtures
        run: npm run test:local -w backend

  compose-regression:
    needs: backend-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm ci
      - name: Verify new migration inputs inside the real production image
        run: node scripts/maintenance/verify-compose-runtime.mjs
      - name: Save current Compose regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-compose-validation-${{ github.sha }}
          path: docs/audits/evidence/compose-runtime-2026-10-08.json
          if-no-files-found: warn
          retention-days: 14
