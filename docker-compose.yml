services:
  postgres:
    # Shared/Supabase mode does not start a second database. For standalone
    # local storage: docker compose --profile local-db up -d
    profiles: ['local-db']
    image: postgres:16-alpine
    container_name: bin_al_ajouz_db
    environment:
      POSTGRES_USER: ${DB_USER:-erp_user}
      # An empty password fails closed in the official PostgreSQL image.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_DB: ${DB_NAME:-bin_al_ajouz}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/migrations/002_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-erp_user} -d ${DB_NAME:-bin_al_ajouz}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  redis:
    image: redis:7-alpine
    container_name: bin_al_ajouz_redis
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always

  backend:
    stop_grace_period: 35s
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bin_al_ajouz_api
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_HOST=${DB_HOST:-postgres}
      - ERP_LOCAL_DATABASE_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-bin_al_ajouz}
      - DB_USER=${DB_USER:-erp_user}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_SSL=${DB_SSL:-false}
      - DB_POOL_MODE=${DB_POOL_MODE:-auto}
      - DB_POOL_MAX=${DB_POOL_MAX:-3}
      - DB_MAINTENANCE_POOL_MAX=${DB_MAINTENANCE_POOL_MAX:-3}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env before starting Docker}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:?Set BACKUP_ENCRYPTION_KEY in .env before starting Docker}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000,https://agoouz.vercel.app}
      - CORS_LAN_ORIGINS=${CORS_LAN_ORIGINS:-}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-200}
      - COMPANY_NAME=${COMPANY_NAME:-Bin Al-Ajouz}
    ports:
      - '127.0.0.1:${PORT:-3000}:${PORT:-3000}'
    volumes:
      - api_backups:/app/backend/backups
      - api_logs:/app/backend/logs
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
  redisdata:
  api_backups:
  api_logs:
