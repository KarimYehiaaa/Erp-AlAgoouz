name: Desktop POS Release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: './package-lock.json'

      - name: Install workspace dependencies
        run: npm ci

      - name: Install Desktop POS dependencies
        working-directory: desktop-pos
        run: npm ci

      - name: Desktop POS tests
        working-directory: desktop-pos
        run: npm test

      - name: Build and publish Desktop POS
        working-directory: desktop-pos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build -- --publish always
